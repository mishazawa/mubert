<!DOCTYPE html>
<html lang="en">

<head>

<body>
  <div id="root"></div>
  <div class="audio_ctrl">
    <button id="audio_btn">Play</button>
    <audio id="audio" controls crossorigin="anonymous" />
  </div>
  <script type="module" src="/main.tsx"></script>
</body>
<script>
  var audio = document.getElementById("audio");
  var audioBtn = document.getElementById("audio_btn");

  audio.autoplay = true;
  var ctx = new (window.AudioContext || window.webkitAudioContext)();
  var analyser = ctx.createAnalyser();
  analyser.fftSize = 64;
  var data = new Uint8Array(analyser.frequencyBinCount);
  let audioReady = false;

  function renderLoop() {
    if (audioReady) {
      analyser.getByteFrequencyData(dataArray);
    }
    requestAnimationFrame(renderLoop);
  }

  audioBtn.onclick = () => {
    new Promise((resolve, reject) => {
      setTimeout(() => resolve('/test_sound.mp3'), 500);
    }).then(src => {
      audio.src = src;
      audio.play();
    })
  }

  audio.addEventListener('canplay', async () => {
    await ctx.resume();
    if (!audioReady) {
      source = ctx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(ctx.destination);
      audioReady = true;
    }
  });

  window.dataArray = data;
  renderLoop();
</script>

</html>
