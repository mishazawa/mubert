  <div class="audio_ctrl">

    <audio id="audio" controls crossorigin="anonymous" src="/test_sound.mp3" />
  </div>
  <script type="module" src="/main.tsx"></script>

<script>
  var audio = document.getElementById("audio");
  // var audioBtn = document.getElementById("audio_btn");

  audio.autoplay = true;
  var ctx = new (window.AudioContext || window.webkitAudioContext)();
  var analyser = ctx.createAnalyser();
  // analyser.fftSize = window.FFT_DATA_SIZE;
  analyser.fftSize = 256;
  window.fftSize = analyser.fftSize;
  var data = new Uint8Array(analyser.frequencyBinCount);
  let audioReady = false;

  function renderLoop() {
    if (audioReady) {
      analyser.getByteFrequencyData(dataArray);
    }
    requestAnimationFrame(renderLoop);
  }

  audio.addEventListener('play', async () => {
    await ctx.resume();               // unlock AudioContext on user gesture
    if (!audioReady) {                // connect only once
      const source = ctx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(ctx.destination);
      audioReady = true;
    }
  });

  audio.addEventListener('ended', () => {
    audio.currentTime = 0;
    audio.play();
  });

  window.dataArray = data;
  renderLoop();
</script>
